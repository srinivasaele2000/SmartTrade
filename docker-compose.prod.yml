name: smarttrade-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smarttrade}
      POSTGRES_USER: ${POSTGRES_USER:-smarttrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      GUNICORN_TIMEOUT: "180"
      DJANGO_SETTINGS_MODULE: config.settings_prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env.prod}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-189.72.155.44}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://189.72.155.44}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://189.72.155.44}
      USE_HTTPS: ${USE_HTTPS:-false}
      POSTGRES_DB: ${POSTGRES_DB:-smarttrade}
      POSTGRES_USER: ${POSTGRES_USER:-smarttrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_HOST: db
      STATIC_ROOT: /data/static
      MEDIA_ROOT: /data/private
      CATALOGUE_MEDIA_ROOT: /data/catalogue
      SMARTTRADE_OTP_PROVIDER: ${SMARTTRADE_OTP_PROVIDER:-}
      SMARTTRADE_COMPANY_EMAIL_PROVIDER: ${SMARTTRADE_COMPANY_EMAIL_PROVIDER:-}
      SMARTTRADE_COMPANY_DOCUMENT_MAX_BYTES: ${SMARTTRADE_COMPANY_DOCUMENT_MAX_BYTES:-}
      SMARTTRADE_COMPANY_DOCUMENT_ALLOWED_TYPES: ${SMARTTRADE_COMPANY_DOCUMENT_ALLOWED_TYPES:-}
      SMARTTRADE_COMPANY_REQUIRED_DOCUMENT_TYPES: ${SMARTTRADE_COMPANY_REQUIRED_DOCUMENT_TYPES:-}
    volumes:
      - static_volume:/data/static
      - private_uploads:/data/private
      - catalogue_uploads:/data/catalogue
      - media_volume:/data/public-media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client, os; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=3); c.request('GET','/api/v1/health',headers={'Host':os.environ['ALLOWED_HOSTS'].split(',')[0].strip(),'X-Forwarded-Proto':'https' if os.environ['USE_HTTPS'].lower() in ('1','true','yes') else 'http'}); assert c.getresponse().status == 200"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api/v1
        EXPO_PUBLIC_API_URL: /api/v1
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./releases/apk:/usr/share/nginx/html/downloads:ro
      - static_volume:/srv/static:ro
      - media_volume:/srv/public-media:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume:
  media_volume:
  private_uploads:
  catalogue_uploads:
