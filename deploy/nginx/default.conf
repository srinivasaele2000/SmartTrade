server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name 189.72.155.44;
    root /usr/share/nginx/html;
    client_max_body_size 30M;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 125s;
    proxy_send_timeout 125s;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /admin/ {
        proxy_pass http://api:8000;
    }

    # UUID catalogue media is checked for current product visibility by Django.
    location ^~ /media/catalogue/ {
        proxy_pass http://api:8000;
    }

    location /static/ {
        alias /srv/static/;
        autoindex off;
    }

    # This volume contains only assets explicitly intended for public access.
    location /media/ {
        alias /srv/public-media/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /downloads/SmartTrade-latest.apk {
        types { }
        default_type application/vnd.android.package-archive;
        try_files $uri =404;
        add_header Content-Disposition 'attachment; filename="SmartTrade-latest.apk"';
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location = /downloads/apk-meta.json {
        types { }
        default_type application/json;
        try_files $uri =404;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location ^~ /downloads/ {
        return 404;
    }

    location = /app {
        return 308 /app/;
    }

    location ^~ /app/_expo/ {
        try_files $uri =404;
    }

    location ^~ /app/assets/ {
        try_files $uri =404;
    }

    location = /app/index.html {
        add_header Cache-Control "no-cache";
    }

    location /app/ {
        try_files $uri /app/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
